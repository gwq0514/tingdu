<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>听读 · 管理员词库</title><link rel="stylesheet" href="/admin.css"></head><body><header><strong>听读</strong><span>管理员词库</span><button id="logout" hidden>退出</button></header><main><section id="login"><h1>管理员入口</h1><p>此页面仅限本机访问，不出现在用户页面。</p><form id="loginForm"><label for="password">管理口令</label><input id="password" type="password" autocomplete="off" required placeholder="粘贴本机的管理口令"><p class="hint">口令保存在项目的 data/admin/管理口令.txt 中，仅供你管理词库使用。</p><button>进入管理</button></form></section><section id="editor" hidden><div class="heading"><div><h1>专有词纠正</h1><p>SenseVoice 不支持原生热词加权；这里在识别后按你配置的写法纠正文字。</p></div><span id="revision"></span></div><label class="toggle"><input type="checkbox" id="enabled">启用词语纠正</label><label for="entries">每行一条：正确词语 | 常见误识别写法 | 其他误识别写法（可选）</label><textarea id="entries" spellcheck="false" placeholder="例如：听读 | 听堵 | 听独&#10;只填写确实需要纠正的专有词，示例不会自动保存。"></textarea><p class="hint">精确匹配、长词优先，不会自动猜测同音词。误识别写法至少2字；可能误改正常表达，请用下方测试确认。最多1000条，每条最多10种误识别写法。</p><div class="actions"><button id="save">保存配置</button><button id="reload" class="sub">重新载入</button><span id="saveState"></span></div><section class="preview"><h2>测试已保存的规则</h2><label for="sample">粘贴一段误识别文字</label><textarea id="sample" placeholder="例如：今天测试听堵的录音功能。"></textarea><button id="preview" class="sub">测试纠正</button><div id="result" aria-live="polite"></div></section><p class="hint">保存后从下一段识别开始生效，无需重启模型。已保存的历史记录保持原样；使用新词库重转写，请到录音页面选择“重新处理”。本机原始录音始终保留。</p></section><p id="notice" role="status"></p></main><script src="/admin.js"></script></body></html>
