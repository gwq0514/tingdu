name: Source checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m unittest tests test_subscriptions test_meetings test_recording_priority test_audio_processing test_sensevoice test_asr_vocabulary test_all_asr test_live_delete test_meeting_minutes
      - run: node test-meeting-client.cjs && node test-meeting-audio.cjs && node test-local-save.cjs && node test-export.cjs && node desktop/test-policy.cjs
